# Run the whole app with: docker compose up --build
#   Website:  http://localhost:3000
#   API:      http://localhost:8080/api   (health check: /api/health)
#   Database: localhost:5434 (user/password from .env, default studymate/studymate)
# Settings (email, ports, demo data) are read from the .env file next to this one. See .env.example.
# Without email settings the login codes are printed in the backend log:
#   docker compose logs backend | grep "Login code"

name: studymate

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studymate
      POSTGRES_USER: ${DB_USER:-studymate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studymate}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5434}:5432" # not 5432, so it doesn't clash with a local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d studymate"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studymate
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-studymate}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-studymate}
      STUDYMATE_DEMO_DATA_ENABLED: ${DEMO_DATA:-true}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Almaty}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-auto}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-${GMAIL_USER:-}}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-${GMAIL_APP_PASSWORD:-}}
      MAIL_FROM: ${MAIL_FROM:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Asks /api/health, which answers 200 only when the app runs and the database answers.
      # Plain bash, because the Java image has no curl. (/dev/tcp is a bash feature.)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    # The health check (is the website up?) is in frontend/Dockerfile

volumes:
  db-data:
