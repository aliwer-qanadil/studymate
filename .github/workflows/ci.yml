name: CI

# Runs on every pull request and every push to main: checks the frontend, runs the backend tests
# against a real PostgreSQL database, and makes sure the Docker images build.
on:
  push:
    branches: [main]
  pull_request:
  # Also run by deploy-production.yml before a release goes out
  workflow_call:

# A newer push to the same branch or pull request cancels the older run
concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: studymate
          POSTGRES_USER: studymate
          POSTGRES_PASSWORD: studymate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studymate -d studymate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/studymate
      SPRING_DATASOURCE_USERNAME: studymate
      SPRING_DATASOURCE_PASSWORD: studymate
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B test

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      # Start the whole stack and wait until every health check passes,
      # so a broken health check or a backend that can't boot fails CI.
      - run: docker compose up -d --wait --wait-timeout 180
      - if: failure()
        run: docker compose ps -a && docker compose logs --tail 80
      - if: always()
        run: docker compose down -v
