spring.application.name=studymate

# Database settings come from environment variables. The defaults below are for
# local development only; docker-compose.yml and deployments must override them.
# No real password is stored in this file.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studymate}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:studymate}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:studymate}

# "update" is convenient for development. For a deployed beta, set
# SPRING_JPA_HIBERNATE_DDL_AUTO=validate once the schema is stable.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}
# Trust X-Forwarded-* headers from the reverse proxy (nginx or a cloud load balancer),
# so the app sees the public https:// address and the CORS origin check works.
server.forward-headers-strategy=framework

# Demo students and study groups. Enabled only when explicitly turned on.
studymate.demo-data.enabled=${STUDYMATE_DEMO_DATA_ENABLED:false}

# Email for login codes. GMAIL_USER and GMAIL_APP_PASSWORD are read from the .env file
# in the backend folder (or from environment variables), so they are never committed.
# GMAIL_APP_PASSWORD is a Gmail "App password", not your normal Gmail password.
spring.config.import=optional:file:.env[.properties]
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
