spring.application.name=studymate

# Every setting below can be changed with an environment variable, so the same build runs
# locally, in Docker, on staging and in production. No real password is stored in this file.
# The full list is in the README ("Environment variables") and in .env.example.

# --- Database ---
# Either SPRING_DATASOURCE_URL (jdbc:postgresql://...) or DATABASE_URL (postgres://user:pass@host/db,
# the form most cloud hosts give) or DB_HOST / DB_PORT / DB_NAME. DATABASE_URL is read in StudymateApplication.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studymate}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:studymate}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:studymate}}
# Small pool: free database plans allow only a few connections
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Hibernate creates and updates the tables. "update" only adds tables and columns, it never drops data.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Web server ---
# PORT is what Render, Railway, Fly and Heroku set; SERVER_PORT works too.
server.port=${PORT:${SERVER_PORT:8080}}
# Trust X-Forwarded-* headers from the reverse proxy (nginx or a cloud load balancer),
# so the app sees the public https:// address and the visitor's IP.
server.forward-headers-strategy=framework
# Finish running requests before stopping during a redeploy
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Error pages never show stack traces
server.error.include-stacktrace=never
server.error.include-message=always

# Browsers on these sites may call the API directly (comma-separated, wildcards allowed).
# Not needed when the frontend's nginx forwards /api, because then both are on one address.
studymate.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Demo students and study groups. Enabled only when explicitly turned on.
studymate.demo-data.enabled=${STUDYMATE_DEMO_DATA_ENABLED:false}

# --- Email for login codes ---
# MAIL_PROVIDER: auto (default), smtp, brevo or log. See LoginCodeMailer for what each one does.
# For a local run the values can also come from a .env file in the backend folder.
spring.config.import=optional:file:.env[.properties]
studymate.mail.provider=${MAIL_PROVIDER:auto}
studymate.mail.from=${MAIL_FROM:${spring.mail.username}}
studymate.mail.brevo-api-key=${BREVO_API_KEY:}
# SMTP settings. The GMAIL_* names still work, so older .env files keep working.
# GMAIL_APP_PASSWORD is a Gmail "App password", not your normal Gmail password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:${GMAIL_USER:}}
spring.mail.password=${MAIL_PASSWORD:${GMAIL_APP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
